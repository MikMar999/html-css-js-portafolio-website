<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Little things</title>
<link rel="stylesheet" href="style.css" />
<style>
/* Typography */
h1 { 
  font-size: 32px; 
  font-weight: bold; 
  margin-bottom: 20px; 
  font-style: italic; 
}
h2 { 
  font-size: 24px; 
  font-weight: 600; 
  margin-bottom: 15px; 
}
p { 
  font-size: 16px; 
  line-height: 1.8; 
  margin-bottom: 20px; 
}

/* Body */
body {
  margin: 0;
  padding: 0;
  font-family: 'Aspekta', sans-serif;
  background: url('cueva con.png') no-repeat center center fixed;
  background-size: cover;
  color: #e4ebdb;
  overflow-x: visible;
}

/* Navigation */
nav#desktop-nav {
  display: flex;
  align-items: center;      
  justify-content: space-between; 
  padding: 0.5rem 1.5rem;
  height: 40px;             
  border-bottom: 1px solid #dee6d5;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background: transparent;
  z-index: 100;
}

.nav-links { 
  list-style: none; 
  display: flex; 
  gap: 2rem; 
  margin: 0; 
  padding: 0; 
  font-size: 1.5rem; 
}

.nav-links a { 
  text-decoration: underline; 
  color: #e4ebdb; 
  transition: color 0.3s;
}
.nav-links a:hover { color: greenyellow; }

.logo {
  font-size: 3rem;
  line-height: 1;
}

/* Responsive logo + nav */
@media (max-width: 600px) {
  nav#desktop-nav {
    height: auto;            
    padding: 0.5rem 1rem;
  }

  .logo {
    font-size: 1.8rem;       
    margin-bottom: 0;        
  }

  .nav-links {
    font-size: 1.2rem;       
  }
}

/* Hamburger */
.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
  gap: 5px;
}
.hamburger div {
  width: 25px;
  height: 3px;
  background-color: #e4ebdb;
  transition: all 0.3s ease;
}

/* Layout */
main {
  padding-top: 60px; 
  display: flex;
  flex-direction: column;
  align-items: flex-start; 
  padding-left: 0px;
}

/* Grid container */
.image-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr); 
  gap: 10px;
  margin-top: 60px; /* shift down 20px from before */
}

/* Grid images */
.image-grid img {
  width: 100%;
  height: auto;
  object-fit: cover;
  cursor: pointer;
  transition: transform 0.3s ease;
  display: block;
}

/* Overlay */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(20px);
  background-color: rgba(0,0,0,0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 9999;
}

.overlay.active {
  opacity: 1;
  pointer-events: all;
}

.overlay img {
  max-width: 40%;
  max-height: 40%;
  transform: scale(1);
  transition: transform 0.3s ease;
}

.overlay.active img {
  transform: scale(2); /* 4x enlargement */
}
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 4rem;
  color: #e4ebdb;
  cursor: pointer;
  padding: 0 20px;
  user-select: none;
  transition: 0.3s ease;
}

.arrow:hover {
  color: greenyellow;
}

.arrow.left {
  left: 5%;
}

.arrow.right {
  right: 5%;
}
</style>
</head>
<body>

  <body>

    <!-- Grid of images -->
    <div class="image-grid" id="imageGrid"></div>
    
    <!-- ✅ Correct overlay (only one!) -->
    <div class="overlay" id="overlay">
      <div class="arrow left" id="prevBtn">. ݁₊⊹.</div>
      <img id="overlayImg" src="" alt="Enlarged Image">
      <div class="arrow right" id="nextBtn">.⊹₊ ݁.</div>
    </div>
    
    <!-- Navigation -->
    <nav id="desktop-nav">
      <div class="logo">Little things</div>
      <div class="hamburger" id="hamburger">
        <div></div>
        <div></div>
        <div></div>
      </div>
    
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="experience.html">Experience</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

<script>
  const imageGrid = document.getElementById('imageGrid');
  const overlay = document.getElementById('overlay');
  const overlayImg = document.getElementById('overlayImg');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  
  const totalImages = 44;
  let currentIndex = 0;
  
  // Create and display grid images
  for (let i = 1; i <= totalImages; i++) {
    const img = document.createElement('img');
    img.src = `carousel/image${i}.jpg`; 
    img.alt = `Image ${i}`;
    img.dataset.index = i;
  
    // Open overlay when clicked
    img.addEventListener('click', () => {
      currentIndex = Number(img.dataset.index);
      overlayImg.src = img.src;
      overlay.classList.add('active');
    });
  
    imageGrid.appendChild(img);
  }
  
  // Close overlay when clicking background (not the image)
  overlay.addEventListener('click', (event) => {
    if (event.target === overlay) {
      overlay.classList.remove('active');
    }
  });
  
  // Show previous image
  prevBtn.addEventListener('click', (event) => {
    event.stopPropagation();
    currentIndex = currentIndex > 1 ? currentIndex - 1 : totalImages;
    overlayImg.src = `carousel/image${currentIndex}.jpg`;
  });
  
  // Show next image
  nextBtn.addEventListener('click', (event) => {
    event.stopPropagation();
    currentIndex = currentIndex < totalImages ? currentIndex + 1 : 1;
    overlayImg.src = `carousel/image${currentIndex}.jpg`;
  });
  </script>

</body>
</html>
